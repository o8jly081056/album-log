<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHeard">
<title>SHeard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#121212; --bg2:#1c1c1e; --bg3:#2a2a2d; --line:#333338;
  --fg:#f2f2f2; --fg2:#a8a8ae; --fg3:#6c6c72;
  --accent:#2ad468; --accent-fg:#04210f; --heard:#2ad468; --star:#f5c542; --want:#7aa7ff;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 12px) 16px calc(90px + var(--safe-b))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
header.top h1{font-size:26px;margin:0;font-weight:800;letter-spacing:.5px}
header.top .sub{color:var(--fg2);font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);flex:none;position:relative}
.icon-btn:active{transform:scale(.94)}
.dot{position:absolute;right:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--heard);border:2px solid var(--bg)}
.dot.off{background:var(--fg3)} .dot.busy{background:var(--star)}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px;height:44px;border-radius:12px}
.search svg{position:absolute;left:12px;top:13px;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--bg2);color:var(--fg2);font-size:13px}
.chip.on{background:var(--fg);color:#111;font-weight:600}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--fg2)} .small{font-size:12.5px}
.empty{text-align:center;color:var(--fg2);padding:40px 12px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media (max-width:380px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:138px;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.card{position:relative;text-align:left;min-width:0;cursor:pointer}
.cover{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg3)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:var(--fg3)}
.badge{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.7);font-size:11px;font-weight:600}
.acts{position:absolute;right:6px;bottom:6px;display:flex;gap:6px}
.mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.5);backdrop-filter:blur(4px)}
.mini.heard{background:var(--heard);border-color:var(--heard);color:#04210f}
.mini.want{background:var(--want);border-color:var(--want);color:#06142e}
.card .t{font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600}
.lbl.heard{color:var(--heard)} .lbl.want{color:var(--want)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li .av{width:52px;height:52px;border-radius:50%;background:var(--bg3);flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--fg2)}
.li .av img{width:100%;height:100%;object-fit:cover}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--heard);border-radius:4px}

.artist-hero{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.artist-hero .av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--bg3);flex:none}
.artist-hero .av img{width:100%;height:100%;object-fit:cover}
.artist-hero h2{margin:0;font-size:22px}
.section-h{font-size:13px;color:var(--fg2);letter-spacing:1px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.section-h:first-child{margin-top:4px}

.panel{background:var(--bg2);border-radius:14px;padding:14px}
.np{display:flex;gap:12px;align-items:center;cursor:pointer}
.np .c{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg3);flex:none}
.np .c img{width:100%;height:100%;object-fit:cover}
.np .grow{flex:1;min-width:0}
.np .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:5px}
.eq i{width:3px;background:var(--heard);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,18,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
nav.tabs .in{display:flex;max-width:720px;width:100%}
nav.tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg3);font-size:11px}
nav.tabs button.on{color:var(--fg)}
nav.tabs button.on svg{color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg2);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:10px 18px calc(24px + var(--safe-b));max-width:720px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.detail-cover{width:min(260px,70vw);aspect-ratio:1;border-radius:12px;overflow:hidden;margin:0 auto 14px;background:var(--bg3);box-shadow:0 12px 40px rgba(0,0,0,.5);position:relative}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail h2{text-align:center;margin:0 0 2px;font-size:21px}
.detail .by{text-align:center;color:var(--accent);font-weight:600}
.detail .meta{text-align:center;color:var(--fg2);font-size:13px;margin-top:2px}
.two{display:flex;gap:10px;margin-top:16px}
.big-btn{flex:1;height:52px;border-radius:999px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg3)}
.big-btn.heard{background:var(--heard);color:#04210f}
.big-btn.want{background:var(--want);color:#06142e}
.big-btn.solid{background:var(--fg);color:#111}
.btn{text-decoration:none;color:var(--fg);height:42px;border-radius:999px;padding:0 16px;background:var(--bg3);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.sm{height:34px;font-size:13px;padding:0 12px}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
.stars{display:flex;justify-content:center;gap:6px;margin-top:14px}
.stars button{font-size:28px;color:var(--fg3);line-height:1}
.stars button.on{color:var(--star)}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:5px}
.tracks{margin-top:14px;border-top:1px solid var(--line)}
.tracks div{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tracks span{color:var(--fg3);width:22px;text-align:right;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--fg);color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.spinner{width:28px;height:28px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
.spinner.sm{width:20px;height:20px;margin:16px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--fg2);margin-bottom:6px;padding:6px 0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);white-space:nowrap}
.toggle input{width:auto}
.menu-h{font-size:12.5px;color:var(--fg2);margin:20px 0 6px;letter-spacing:1px}
.err{color:#ff8a8a;font-size:13px;margin-top:8px}
.sort-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600}
.sort-btn .muted{font-weight:400}
.sort-opt.on .name{color:var(--accent)}
.sort-check{color:var(--accent)}
.card .no{color:var(--fg3);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.dialog{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .18s}
.dialog.show{opacity:1}
.dialog-box{background:var(--bg2);border-radius:18px;padding:22px 20px 16px;width:100%;max-width:320px;text-align:center;transform:scale(.94);transition:transform .18s}
.dialog.show .dialog-box{transform:none}
.dialog-box h3{margin:0 0 8px;font-size:17px}
.dialog-box p{margin:0 0 18px;font-size:14px;line-height:1.5}
.dialog-btns{display:flex;gap:10px}
.dialog-btns .btn{flex:1}
.btn.danger{background:#e5484d;color:#fff}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabs"><div class="in">
  <button data-tab="search"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>探索</button>
  <button data-tab="heard"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>已聽過</button>
  <button data-tab="want"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>想聽</button>
  <button data-tab="artists"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>歌手</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
